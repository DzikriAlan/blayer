name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` menjalankan postinstall (prisma generate), jadi tipe hasil
      # generate sudah ada sebelum typecheck berjalan.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # Build ikut diuji supaya kesalahan yang hanya muncul saat kompilasi
      # produksi ketahuan di PR, bukan saat deploy.
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
